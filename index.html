    <link rel="manifest" id="qit-manifest" href="/manifest.webmanifest" />
    <script>
      // "Add to Home Screen" / "Install app" opens where it was installed from:
      // the admin panel, the Teacher Dashboard or the public website.
      (function () {
        var link = document.getElementById('qit-manifest');
        function set() {
          var p = location.pathname;
          var area = p.indexOf('/admin') === 0 ? 'admin' : p.indexOf('/teacher') === 0 ? 'teacher' : '';
          var href = area ? '/manifest-' + area + '.webmanifest' : '/manifest.webmanifest';
          if (link.getAttribute('href') !== href) link.setAttribute('href', href);
          var title = document.querySelector('meta[name="apple-mobile-web-app-title"]');
          if (title) title.setAttribute('content', area === 'admin' ? 'QIT Admin' : area === 'teacher' ? 'QIT Teacher' : 'QIT');
        }
        // v153: remember the last private area; a home-screen app that starts on the
        // public page while signed in goes straight back to it (admin → dashboard).
        function remember() {
          var p = location.pathname;
          try {
            if (p.indexOf('/admin/login') !== 0 && p.indexOf('/admin') === 0) localStorage.setItem('qit:home-area', '/admin/portal');
            else if (p.indexOf('/teacher') === 0 && p.indexOf('/teacher/login') !== 0) localStorage.setItem('qit:home-area', '/teacher');
          } catch (e) {}
        }
        try {
          var standalone = window.navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
          var first = !sessionStorage.getItem('qit:launched');
          sessionStorage.setItem('qit:launched', '1');
          var home = localStorage.getItem('qit:home-area');
          if (standalone && first && home && location.pathname === '/' && !location.search && localStorage.getItem('qit-auth')) location.replace(home);
        } catch (e) {}
        var set0 = set; set = function () { set0(); remember(); };
        set();
        // v162: iPhone / iPad read the app details (name, start page) only when a page
        // loads. Moving between the website, the admin panel and the Teacher Dashboard
        // inside the page (e.g. after signing in) would keep the website's details, and
        // "Add to Home Screen" would open the public website. So on iOS, crossing into
        // another area loads that page fresh once.
        var areaOf = function (p) { return p.indexOf('/admin') === 0 ? 'admin' : p.indexOf('/teacher') === 0 ? 'teacher' : ''; };
        var loadArea = areaOf(location.pathname);
        var ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        ['pushState', 'replaceState'].forEach(function (k) {
          var orig = history[k];
          history[k] = function () {
            var r = orig.apply(this, arguments);
            try {
              set();
              var now = areaOf(location.pathname);
              if (ios && now && now !== loadArea) { loadArea = now; setTimeout(function () { location.reload(); }, 0); }
            } catch (e) {}
            return r;
          };
        });
        window.addEventListener('popstate', set);
        document.addEventListener('DOMContentLoaded', set);
      })();
    </script>

    <script>
      // Apply the saved theme before the page paints (public pages only)
      (function () {
        try {
          if (location.pathname.indexOf('/admin') === 0) return;
          // Saved language: set <html lang> and start the Bengali font early,
          // only where বাংলা is offered (same time zones as src/i18n/LanguageContext.jsx)
          var bnZones = ['Asia/Dhaka','Asia/Kuala_Lumpur','Asia/Kuching','Asia/Singapore','Asia/Riyadh','Asia/Dubai','Asia/Muscat','Asia/Qatar','Asia/Kuwait','Asia/Bahrain','Asia/Amman','Asia/Beirut','Asia/Baghdad','Asia/Damascus','Asia/Aden','Asia/Gaza','Asia/Hebron','Asia/Jerusalem','Asia/Tel_Aviv','Africa/Cairo','Asia/Tehran','Europe/Istanbul','Asia/Istanbul'];
          var tz = '';
          try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone; } catch (e) {}
          if (localStorage.getItem('qit:lang') === 'bn' && bnZones.indexOf(tz) !== -1) {
            document.documentElement.lang = 'bn';
            [['qit-bn-font', '/fonts/HindSiliguri-Regular.woff2'], ['qit-bn-font-bold', '/fonts/Aikya.woff2'], ['qit-bn-font-digits', '/fonts/NotoSansBengali-Variable.woff2']].forEach(function (x) {
              var f = document.createElement('link');
              f.id = x[0];
              f.rel = 'preload';
              f.as = 'font';
              f.type = 'font/woff2';
              f.crossOrigin = 'anonymous';
              f.href = x[1];
              document.head.appendChild(f);
            });
          }
          var t = localStorage.getItem('qit:theme');
          if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches))
            document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
